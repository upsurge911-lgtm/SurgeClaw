<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 564.6 440" width="564.6" height="440" style="--bg:#0e0e0e;--fg:#ffffff;--line:#33d17a;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line x1="70" y1="70" x2="70" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="210" y1="70" x2="210" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="350" y1="70" x2="350" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="490" y1="70" x2="490" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="140" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">surgeclaw configure Marketing</text>
<line x1="210" y1="130" x2="350" y2="130" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="280" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Spawn with Isolated ENV</text>
<line x1="70" y1="170" x2="350" y2="170" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="210" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">openclaw setup</text>
<line x1="350" y1="210" x2="490" y2="210" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="420" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Executing in Vault</text>
<line x1="490" y1="250" x2="70" y2="250" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="280" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">(Native Wizard UI)</text>
<line x1="70" y1="290" x2="350" y2="290" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="210" y="284" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">exit</text>
<line x1="350" y1="330" x2="210" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="280" y="324" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Closed</text>
<line x1="210" y1="370" x2="70" y2="370" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="140" y="364" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Back in Kingdom</text>
<rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="70" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">User</text>
<rect x="161.825" y="30" width="96.35000000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="210" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">SurgeClaw</text>
<rect x="301.825" y="30" width="96.35000000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="350" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Sub-Shell</text>
<rect x="445.4" y="30" width="89.2" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="490" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">OpenClaw</text>
</svg>